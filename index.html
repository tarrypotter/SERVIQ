const RefundSheet={
  open(id,cancel){const o=Data.get('orders',id);const food=['cafe','restaurant'].includes(App.settings().industry);const qty={},restock={};o.items.forEach(l=>{qty[l.lineId]=cancel?l.quantity-l.refundedQty:0;restock[l.lineId]=!food&&l.trackStock});
    Sheet.open({key:'refund',title:cancel?'취소 및 전액 환불':'환불',state:{id,cancel,qty,restock,mode:'item',amount:'',reason:'',refundId:App.pending('refund:'+id),alloc:null},body:RefundSheet.body,foot:RefundSheet.foot,onBind:(s,p)=>{if(p==='amount'){s.state.alloc=null;RefundSheet.live(s)}else if(p.startsWith('alloc'))RefundSheet.live(s)}})},
  pv(st,o){try{if(st.mode==='amount'){if(st.amount==='')return null;const n=U.parseInt(st.amount);if(Number.isNaN(n))return{err:'금액은 정수로 입력하세요.'};return RefundService.preview(o,{amount:n})}const items=Object.entries(st.qty).filter(([,q])=>q>0).map(([lineId,qty])=>({lineId,qty}));if(!items.length)return null;return RefundService.preview(o,{items})}catch(e){return{err:e.message}}},
  live(s){const r=s.el.querySelector('[data-live]');if(r)r.innerHTML=ser(RefundSheet.summary(s));s.el.querySelector('.sheet-f').innerHTML=ser(RefundSheet.foot(s))},
  remain(o){return RefundService.methodRemain(o,Data.list('payments'),Data.list('refunds'))},
  allocs(st,o,total){const remain=this.remain(o);const keys=Object.keys(remain).filter(k=>remain[k]>0);if(st.alloc&&st.allocTotal===total)return st.alloc;const d=RefundService.defaultAlloc(remain,total);st.alloc=Object.fromEntries(keys.map(k=>[k,String((d.find(a=>a.method===k)||{amount:0}).amount)]));st.allocTotal=total;return st.alloc},
  summary(s){const st=s.state,o=Data.get('orders',st.id),p=this.pv(st,o);if(!p)return html`<div class="muted small">환불할 ${st.mode==='amount'?'금액':'수량'}을 입력하세요.</div>`;if(p.err)return html`<div class="banner err">${p.err}</div>`;const remain=this.remain(o),keys=Object.keys(remain).filter(k=>remain[k]>0);const alloc=this.allocs(st,o,p.total);const sum=Object.values(alloc).reduce((a,v)=>a+(U.parseInt(v)||0),0);
    return html`<div class="tape-row total"><span>환불 금액</span><span class="amt" data-testid="refund-amount">${won(p.total)}</span></div><div class="xs muted">할인·포인트를 반영한 실결제액 기준입니다. 세금 ${won(p.rows.reduce((a,r)=>a+r.tax,0))} 포함.</div>
    <div class="flabel" style="margin-top:10px">환불 수단</div>${keys.length>1?html`<div class="stack" style="gap:6px;margin-top:4px">${keys.map(k=>html`<div class="row"><span style="width:72px">${C.METHODS[k]}</span><input class="input num grow" inputmode="numeric" data-alloc="${k}" data-change="refund.alloc" value="${alloc[k]}"><span class="xs muted" style="white-space:nowrap">최대 ${won(remain[k])}</span></div>`)}${sum!==p.total?html`<div class="small danger-t">수단별 합계가 환불 금액과 ${won(Math.abs(sum-p.total))} 다릅니다.</div>`:''}</div>`:html`<div>${C.METHODS[keys[0]]||'없음'}</div>`}`},
  body(s){const st=s.state,o=Data.get('orders',st.id);
    return html`<div class="stack-l"><div class="small muted">주문 ${o.orderNumber}, 환불 가능 ${won(o.paidTotal-o.refundedTotal)}</div>
    ${st.cancel?'':UI.seg('refund.mode',st.mode,[['item','상품·수량 환불'],['amount','금액 환불']])}
    ${st.mode==='item'?html`<div class="stack">${o.items.map(l=>{const left=l.quantity-l.refundedQty,q=st.qty[l.lineId];return html`<div class="opted"><div class="row between"><div class="grow"><div class="b">${l.productNameSnapshot}</div><div class="small muted">판매 ${l.quantity}개, 실결제 ${won(l.payableAmount)}, 환불 가능 ${left}개</div></div>${left?UI.stepper('refund.q',{l:l.lineId},q,q<=0||st.cancel,q>=left||st.cancel):html`<span class="badge err">환불 완료</span>`}</div>${l.trackStock&&left?html`<label class="switch"><span class="small">재고 복구${q?` (${q*l.stockUsePerUnit}개)`:''}</span><input type="checkbox" data-bind="restock.${l.lineId}" ${st.restock[l.lineId]?new Safe('checked'):''}></label>`:''}</div>`})}${st.cancel?'':html`<button class="btn sm" ${UI.a('refund.all')}>남은 수량 전체 선택</button>`}</div>`:html`<div class="field"><label>환불 금액</label><input class="input num" inputmode="numeric" data-bind="amount" value="${st.amount}" placeholder="0"><div class="hint">상품 수량과 재고는 바뀌지 않습니다.</div></div>`}
    <div class="field"><label>환불 사유</label><input class="input" data-bind="reason" value="${st.reason}" maxlength="100" placeholder="예: 고객 변심"></div>
    <div data-live>${RefundSheet.summary(s)}</div></div>`},
  foot(s){const st=s.state,o=Data.get('orders',st.id),p=RefundSheet.pv(st,o);let ok=p&&!p.err;if(ok){const a=RefundSheet.allocs(st,o,p.total);ok=Object.values(a).reduce((x,v)=>x+(U.parseInt(v)||0),0)===p.total}return html`<button class="btn danger lg block" ${UI.a('refund.ok')} ${ok?'':new Safe('disabled')} data-testid="refund-ok">${p&&!p.err?won(p.total)+' 환불':'환불'}</button>`}
};
Object.assign(Actions,{
  'refund.mode':d=>{const s=Sheet.top();s.state.mode=d.v;s.state.alloc=null;Sheet.paint(s)},
  'refund.q':d=>{const s=Sheet.top(),st=s.state;s.dirty=true;st.qty[d.l]=Math.max(0,st.qty[d.l]+Number(d.d));st.alloc=null;Sheet.paint(s)},
  'refund.all':()=>{const s=Sheet.top(),st=s.state,o=Data.get('orders',st.id);o.items.forEach(l=>st.qty[l.lineId]=l.quantity-l.refundedQty);st.alloc=null;s.dirty=true;Sheet.paint(s)},
  'refund.alloc':(d,el)=>{const s=Sheet.top();s.state.alloc[el.dataset.alloc]=el.value;RefundSheet.live(s)},
  'refund.ok':async()=>{const s=Sheet.top();if(!s||s.key!=='refund')return;const st=s.state,o=Data.get('orders',st.id),p=RefundSheet.pv(st,o);if(!p||p.err)return;
    if(!await Dialog.confirm({title:won(p.total)+'을(를) 환불할까요?',text:'환불은 되돌릴 수 없습니다. 실제 카드 취소나 송금은 외부에서 별도로 진행해야 합니다.',ok:'환불',danger:true}))return;
    const allocations=Object.entries(st.alloc).map(([method,v])=>({method,amount:U.parseInt(v)||0})).filter(a=>a.amount>0);
    const items=st.mode==='item'?Object.entries(st.qty).filter(([,q])=>q>0).map(([lineId,qty])=>({lineId,qty})):[];
    await RefundService.process({refundId:st.refundId,orderId:st.id,items,amount:st.mode==='amount'?U.parseInt(st.amount):null,allocations,reason:st.reason,restock:st.restock,cancelOrder:st.cancel});
    App.clearPending('refund:'+st.id);s.dirty=false;await Sheet.close(true);Toast.ok(won(p.total)+' 환불했습니다')}
});

const ProductEditor={

    const state=p?{...U.clone(p),taxRate,cost:p.cost??'',lowStock:p.lowStock}:{type:'normal',name:'',price:'',cost:'',sku:'',barcode:'',description:'',icon:'',image:null,categoryId:'',active:true,trackStock:true,lowStock:5,taxMode:'default',taxRate:'',optionGroups:[],stockGroupId:'',initialStock:''};

      ${st.image?html`<div class="row"><div class="thumb">${new Safe(`<img alt="" src="${esc(st.image)}">`)}</div><button class="linkbtn d" ${UI.a('pe.noimg')}>이미지 삭제</button></div>`:''}</div>

      <div class="row"><input class="input grow" aria-label="옵션 그룹 이름" placeholder="그룹 이름 (예: 사이즈)" data-bind="optionGroups.${i}.name" value="${g.name}"><button class="iconbtn" aria-label="그룹 삭제" ${UI.a('pe.delg',{i})}>${ico('trash','s')}</button></div>

      ${st.taxMode==='custom'?inp('세율 (%)','taxRate',st.taxRate,'inputmode="decimal"'):''}

    ${st.id?html`<div class="row wrap"><button class="btn sm" ${UI.a('pe.dup')}>복제</button>${st.deletedAt?html`<button class="btn sm" ${UI.a('pe.restore')}>보관 해제</button>`:html`<button class="btn sm danger-soft" ${UI.a('pe.archive')}>보관 (판매 목록에서 숨김)</button>`}</div>`:''}</div>`},
  foot(){return html`<button class="btn primary lg block" ${UI.a('pe.save')} data-testid="p-save">저장</button>`}

Object.assign(Actions,{
  'prod.f':d=>{const s=App.st('products');s.f=d.v;s.limit=undefined;App.rerender()},
  'prod.more':()=>{const s=App.st('products');s.limit=(s.limit||40)+40;App.regionList('products')},
  'product.new':()=>{if(!App.can('catalog'))return App.deny();ProductEditor.open(null)},
  'product.edit':d=>{if(!App.can('catalog'))return App.deny();ProductEditor.open(Data.get('products',d.id))},
  'pe.type':d=>{const s=Sheet.top();s.state.type=d.v;s.dirty=true;if(d.v==='option'&&!s.state.optionGroups.length)s.state.optionGroups=[{id:U.uid(),name:'',required:true,multi:false,choices:[{id:U.uid(),name:'',priceDelta:'',stockUse:''}]}];Sheet.paint(s)},
  'pe.repaint':()=>Sheet.repaint(),
  'pe.addg':()=>{const s=Sheet.top();s.state.optionGroups.push({id:U.uid(),name:'',required:false,multi:false,choices:[{id:U.uid(),name:'',priceDelta:'',stockUse:''}]});s.dirty=true;Sheet.paint(s)},
  'pe.delg':d=>{const s=Sheet.top();s.state.optionGroups.splice(Number(d.i),1);s.dirty=true;Sheet.paint(s)},
  'pe.addc':d=>{const s=Sheet.top();s.state.optionGroups[d.i].choices.push({id:U.uid(),name:'',priceDelta:'',stockUse:''});s.dirty=true;Sheet.paint(s)},
  'pe.delc':d=>{const s=Sheet.top();s.state.optionGroups[d.i].choices.splice(Number(d.j),1);s.dirty=true;Sheet.paint(s)},
  'pe.noimg':()=>{const s=Sheet.top();s.state.image=null;s.dirty=true;Sheet.paint(s)},
  'pe.image':async(d,el)=>{const f=el.files[0];if(!f)return;if(!f.type.startsWith('image/')){Toast.err('이미지 파일을 선택하세요.');return}const s=Sheet.top();s.state.image=await Files.thumb(f);s.dirty=true;Sheet.paint(s)},
  'pe.save':async()=>{const s=Sheet.top();await CatalogService.save(s.state);s.dirty=false;await Sheet.close(true);Toast.ok('상품을 저장했습니다')},
  'pe.dup':async()=>{const s=Sheet.top();await CatalogService.duplicate(s.state.id);s.dirty=false;await Sheet.close(true);Toast.ok('상품을 복제했습니다')},

const Files={
  /* Share sheet → download → copyable text, in that order. Never claims success it can't know. */
  async save(name,text,mime){
    try{if(DB.caps.share&&typeof File==='function'&&navigator.canShare){const f=new File([text],name,{type:mime});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}}catch(e){if(e.name==='AbortError')return;Log.add('공유 실패: '+e.message)}
    if(DB.caps.blob){try{const u=URL.createObjectURL(new Blob([text],{type:mime+';charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);Toast.show('다운로드를 시작했습니다. 파일이 없다면 텍스트 복사를 사용하세요.','ok');Files.lastText={name,text};return}catch(e){Log.add('다운로드 실패: '+e.message)}}
    this.textSheet(name,text)},
  textSheet(name,text){Sheet.open({key:'txt',title:'텍스트로 저장',guard:false,body:html`<p class="small muted" style="margin-bottom:8px">파일 저장이 제한된 환경입니다. 아래 내용을 복사해 안전한 곳에 붙여 넣으세요.</p><textarea class="input" style="height:40vh;font-size:12px" readonly data-copytext>${text}</textarea>`,foot:html`<button class="btn primary block" ${UI.a('txt.copy')}>복사</button>`})},
  async copy(text,el){try{if(DB.caps.clipboard){await navigator.clipboard.writeText(text);return true}}catch(e){}
    try{const t=el||document.createElement('textarea');if(!el){t.value=text;document.body.append(t)}t.select();t.setSelectionRange(0,t.value.length);const ok=document.execCommand('copy');if(!el)t.remove();return ok}catch(e){return false}},
  thumb(file){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(new UserError('이미지를 읽지 못했습니다.'));r.onload=()=>{const i=new Image();i.onerror=()=>rej(new UserError('지원하지 않는 이미지입니다.'));i.onload=()=>{const m=240,k=Math.min(1,m/Math.max(i.width,i.height));const c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=r.result};r.readAsDataURL(file)})}
};

const Integrity={
  /* Works on any dump, so restore can check a backup before touching live data. */
  check(d){const issues=[],a=(s,m)=>issues.push({level:s,msg:m});
    const orders=new Map(d.orders.map(o=>[o.id,o]));const products=new Map(d.products.map(p=>[p.id,p]));
    const payBy=new Map(),refBy=new Map();
    d.payments.forEach(p=>{if(!orders.has(p.orderId))a('err',`결제 ${p.id}: 주문 없음`);if(!Number.isSafeInteger(p.amount)||p.amount<=0)a('err',`결제 ${p.id}: 금액 오류`);payBy.set(p.orderId,(payBy.get(p.orderId)||0)+p.amount)});
    d.refunds.forEach(r=>{if(!orders.has(r.orderId))a('err',`환불 ${r.id}: 주문 없음`);refBy.set(r.orderId,(refBy.get(r.orderId)||0)+r.totalAmount);const s=(r.paymentAllocations||[]).reduce((x,y)=>x+y.amount,0);if(s!==r.totalAmount)a('err',`환불 ${r.id}: 수단별 합계 불일치`)});
    d.orders.forEach(o=>{const n=o.orderNumber;
      if(!Array.isArray(o.items)){a('err',`주문 ${n}: 상품 목록 없음`);return}
      const s=o.items.reduce((x,l)=>x+l.payableAmount,0);if(s!==o.grandTotal)a('err',`주문 ${n}: 상품 합계와 결제 금액 불일치`);
      const paid=payBy.get(o.id)||0,ref=refBy.get(o.id)||0;
      if(o.paymentStatus==='unpaid'||o.paymentStatus==='void'){if(paid)a('err',`주문 ${n}: 미결제인데 결제 기록 있음`)}else if(paid!==o.grandTotal)a('err',`주문 ${n}: 결제 합계 불일치`);
      if(ref!==o.refundedTotal)a('err',`주문 ${n}: 환불 합계 불일치`);if(ref>paid)a('err',`주문 ${n}: 환불이 결제를 초과`);
      o.items.forEach(l=>{if(l.refundedQty>l.quantity)a('err',`주문 ${n}: 환불 수량 초과`);if(l.refundedAmount>l.payableAmount)a('err',`주문 ${n}: 환불 금액 초과`);if(l.restockedQty>l.refundedQty)a('err',`주문 ${n}: 재고 복구 수량 초과`)})});
    const led=new Map(),ids=new Set();d.inventoryMovements.forEach(m=>{if(ids.has(m.id))a('err','재고 이력 중복: '+m.id);ids.add(m.id);led.set(m.variantId,(led.get(m.variantId)||0)+m.quantityDelta)});
    d.productVariants.forEach(v=>{if((led.get(v.id)||0)!==v.stock){const p=products.get(v.productId);a('err',`재고 불일치: ${p?p.name:v.id} (현재 ${v.stock}, 원장 ${led.get(v.id)||0})`)}if(!products.has(v.productId))a('warn','재고 항목의 상품 없음: '+v.id)});
    d.customers.forEach(c=>{const t=d.pointTransactions.filter(x=>x.customerId===c.id).reduce((x,y)=>x+y.delta,0);if(t!==c.points)a('err',`포인트 불일치: ${c.name} (잔액 ${c.points}, 이력 ${t})`)});
    d.businessSessions.forEach(s=>{if(s.status==='closed'&&s.difference!==s.closingCash-s.expectedCash)a('err','정산 차액 불일치: '+s.id)});
    if(d.businessSessions.filter(s=>s.status==='open').length>1)a('err','영업 중 세션이 2개 이상입니다');
    return issues}
};
const Backup={
  build(){return{appName:C.APP,appVersion:C.VERSION,schemaVersion:C.SCHEMA,exportedAt:new Date().toISOString(),...Data.dump()}},
  json(){return JSON.stringify(this.build())},
  validate(text){
    const steps=[],step=(n,ok,msg)=>{steps.push({n,ok,msg});return ok};const res={ok:false,steps};
    let j;try{j=JSON.parse(text);step('JSON 파싱',true)}catch(e){step('JSON 파싱',false,'올바른 JSON이 아닙니다.');return res}
    if(!step('백업 형식',!!j&&typeof j==='object'&&j.appName===C.APP&&C.STORES.every(s=>Array.isArray(j[s])),'SERVIQ 백업 형식이 아니거나 데이터 항목이 빠져 있습니다.'))return res;
    if(!step('스키마 버전',j.schemaVersion===C.SCHEMA,`지원하지 않는 스키마 버전입니다 (백업 ${j.schemaVersion}, 앱 ${C.SCHEMA}).`))return res;
    let bad='';for(const s of C.STORES){const seen=new Set();for(const r of j[s]){if(!r||typeof r!=='object'||typeof r.id!=='string'||!r.id){bad=s+': id가 없는 레코드';break}if(seen.has(r.id)){bad=s+': 중복 id '+r.id;break}seen.add(r.id)}if(bad)break}
    if(!step('데이터 관계',!bad&&j.settings.some(x=>x.id==='main'),bad||'매장 설정이 없습니다.'))return res;
    let issues;try{issues=Integrity.check(j)}catch(e){step('금액 검사',false,'데이터 구조가 손상되었습니다: '+e.message);return res}
    const errs=issues.filter(i=>i.level==='err');if(!step('주문·결제·환불 금액',!errs.length,errs.slice(0,3).map(x=>x.msg).join(' / ')+(errs.length>3?` 외 ${errs.length-3}건`:'')))return res;
    res.ok=true;res.data=j;res.preview={exportedAt:j.exportedAt,appVersion:j.appVersion,counts:Object.fromEntries(C.STORES.map(s=>[s,j[s].length]))};return res},
  /* One transaction: if anything fails, the current data stays untouched. */
  async apply(j){await DB.tx(C.STORES,async ctx=>{for(const s of C.STORES)await ctx.clear(s);for(const s of C.STORES)for(const r of j[s])await ctx.put(s,r)})}
};
const SampleData={

  async add(){
    const m={sample:true},cats={};for(const[n,col]of[['커피','#2563EB'],['디저트','#D99122'],['굿즈','#8B5CC4']])cats[n]=(await CatalogService.saveCategory({name:'[샘플] '+n,color:col,metadata:m})).id;

    const cust=await PeopleService.saveCustomer({name:'[샘플] 김단골',phone:'',memo:'가상 고객',metadata:m});
    const day=86400000;const rnd=(()=>{let s=20261109;return n=>{s=(s*1664525+1013904223)%4294967296;return Math.floor(s/4294967296*n)}})();
    const methods=['card','card','cash','easy','transfer'];const now=Date.now();
    for(let i=0;i<46;i++){const dback=rnd(7);const t=new Date(now-dback*day);t.setHours(8+rnd(11),rnd(60),0,0);const at=Math.min(t.getTime(),now-60000);const n=1+rnd(3);const lines=[];for(let j=0;j<n;j++){const p=made[rnd(made.length)];const ch=p.optionGroups.length?[p.optionGroups[0].choices[rnd(2)].id]:[];const l=Cart.build(p,ch);if(lines.some(x=>x.key===l.key))continue;l.quantity=1+rnd(2);lines.push(l)}
      const s=App.settings();const tot=Pricing.compute(lines,{taxInclusive:s.taxInclusive}).grandTotal;
      const r=await OrderService.place({checkoutId:'sample-'+U.uid(),lines,orderType:'here',customerId:rnd(5)===0?cust.id:null,payments:[{method:methods[rnd(methods.length)],amount:tot}],complete:true,at,sample:true});
      if(i%14===3){const l=r.order.items[0];await RefundService.process({refundId:'sample-'+U.uid(),orderId:r.order.id,items:[{lineId:l.lineId,qty:1}],reason:'샘플 환불',restock:{[l.lineId]:true},at:at+600000})}}
  },
  async remove(){await DB.tx(C.STORES,async ctx=>{const isS=r=>r.metadata&&r.metadata.sample;const del=async(s,keep=()=>false)=>{for(const r of await ctx.getAll(s))if(isS(r)&&!keep(r))await ctx.del(s,r.id)};
    const vs=(await ctx.getAll('productVariants')).filter(isS),vi=new Set(vs.map(v=>v.id));const ms=await ctx.getAll('inventoryMovements');for(const m of ms)if(isS(m)||vi.has(m.variantId))await ctx.del('inventoryMovements',m.id);
    const sc=new Set((await ctx.getAll('customers')).filter(isS).map(c=>c.id));for(const o of await ctx.getAll('orders'))if(!isS(o)&&sc.has(o.customerId)){o.customerId=null;await ctx.put('orders',touch(o))}
    for(const x of await ctx.getAll('pointTransactions'))if(isS(x)||sc.has(x.customerId))await ctx.del('pointTransactions',x.id);
    for(const s of ['payments','refunds','orders','productVariants','products','categories','customers','auditLogs'])await del(s)})}
};

  empId(){let v=null;try{v=localStorage.getItem('serviq.emp')}catch(e){}const s=this.settings();return v&&Data.get('employees',v)?v:(s?s.currentEmployeeId:null)},
  empName(){const e=this.emp();return e?e.name:''},
  setEmp(id){try{localStorage.setItem('serviq.emp',id)}catch(e){}const s=this.settings();if(s)s.currentEmployeeId=id},
  can(p){const e=this.emp();return !e||PERM[p].includes(e.role)},
  deny(){Toast.err('현재 작업자의 역할로는 사용할 수 없는 메뉴입니다.')},
  /* A key stays the same until the action really succeeds, so retries stay idempotent. */
  pending(k){return this.pendingIds[k]=this.pendingIds[k]||U.uid()},
  clearPending(k){delete this.pendingIds[k]},
  err(e){if(e instanceof UserError){Toast.err(e.message);return}Log.add((e&&e.stack)||String(e));Toast.err('처리하지 못했습니다. 데이터는 변경되지 않았습니다.')},
  async saveSettings(patch){await DB.tx(['settings','auditLogs'],async ctx=>{const s=await ctx.get('settings','main');Object.assign(s,patch);await ctx.put('settings',touch(s));await audit(ctx,'SETTINGS','설정 변경: '+Object.keys(patch).join(', '))});this.applyUI()},
  applyUI(){const s=this.settings()||{},r=document.documentElement;const dark=s.theme==='dark'||(s.theme!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=dark?'dark':'light';r.dataset.density=s.density||'comfortable';r.dataset.motion=s.reduceMotion?'reduce':'';try{localStorage.setItem(C.LS_UI,JSON.stringify({theme:s.theme,density:s.density,reduceMotion:s.reduceMotion}))}catch(e){}const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0E1118':'#F7F8FA'},
  modeBanner(){if(DB.mode==='idb')return'';return html`<div class="banner ${DB.mode==='memory'?'err':'warn'}">${ico('alert','s')}<span>${DB.mode==='memory'?'임시 실행 모드: 창을 닫으면 데이터가 사라집니다.':'제한 저장 모드: 백업을 권장합니다.'}</span><button class="btn sm" ${UI.a('go',{to:'backup'})}>백업</button></div>`},
  paintChrome(){const c=Nav.cur,s=Screens[c.name]||{},st=Nav.stack.length,store=Data.get('stores',C.STORE_ID);const bar=document.getElementById('appbar');const n=Notify.items().length;
    bar.innerHTML=html`${st>1?html`<button class="iconbtn" aria-label="뒤로" ${UI.a('nav.back')}>${ico('back')}</button>`:''}${s.brand?html`<div class="brandline">${LOGO}<div class="grow"><div class="store trunc">${store?store.name:'SERVIQ'}</div><div class="sub">${U.today()}</div></div></div>`:html`<h1>${s.title||''}</h1>`}${s.brand?html`<button class="iconbtn" aria-label="전체 검색" ${UI.a('gs.open')}>${ico('search')}</button><button class="iconbtn" aria-label="알림 ${n}개" ${UI.a('noti.open')}>${ico('bell')}${n?html`<span class="dot">${n}</span>`:''}</button><button class="iconbtn" aria-label="설정" ${UI.a('go',{to:'settings'})}>${ico('gear')}</button>`:s.actions?s.actions(c.params):''}`.s;
    document.getElementById('tabbar').innerHTML=TABS.map(([t,l,i])=>html`<button class="tab" ${UI.a('nav.tab',{t})} ${Nav.tab===t?new Safe('aria-current="page"'):''}>${ico(i)}<span>${l}</span></button>`.s).join('');
    const set=this.settings()||{};const cur=Nav.stack[1]?Nav.stack[1].name:Nav.tab;const item=([k,l,i])=>html`<button class="side-item" ${UI.a('nav.side',{to:k})} ${cur===k?new Safe('aria-current="page"'):''}>${ico(i)}${l}</button>`;
    document.getElementById('sidebar').innerHTML=html`<div class="side-brand">${LOGO}<b>SERVIQ</b></div>${TABS.filter(t=>t[0]!=='more').map(item)}<div class="side-gap"></div>${MORE.filter(([k])=>k!=='tables'||set.tablesEnabled).map(item)}`.s},
  /* Failure here shows an error state in the view rather than a white screen. */
  render(scroll){const v=document.getElementById('view'),c=Nav.cur;this.paintChrome();
    try{const s=Screens[c.name];v.innerHTML=ser(s.render(c.params))}
    catch(e){Log.add(e.stack||e.message);v.innerHTML=html`<div class="errbox">${UI.empty('alert','화면을 표시하지 못했습니다','데이터는 안전합니다. 다른 화면으로 이동하거나 다시 시도하세요.',html`<button class="btn" ${UI.a('app.retry')}>새로고침</button>`)}</div>`.s}
    v.scrollTop=scroll||0;document.getElementById('appbar').classList.toggle('scrolled',v.scrollTop>4)},
  rerender(){this.render(document.getElementById('view').scrollTop)},
  refresh(){if(!document.getElementById('shell-ready'))return;this.rerender();const s=Sheet.top();if(s&&s.key==='tbl')Sheet.paint(s)},
  refreshSoon:(()=>{let q=false;return function(){if(q)return;q=true;requestAnimationFrame?requestAnimationFrame(()=>{q=false;App.refresh()}):setTimeout(()=>{q=false;App.refresh()},16)}})(),
  regionList(k){const r=document.querySelector(`[data-region="${k}-list"]`);if(r)r.innerHTML=ser(Screens[k].list())},
  showShell(){if(!document.getElementById('shell-ready')){const m=document.createElement('i');m.id='shell-ready';m.hidden=true;document.body.append(m)}Nav.tab='home';TABS.forEach(([t])=>Nav.stacks[t]=[{name:t,params:{}}]);this.render(0)},
  async start(){this.stMap={};const done=Data.get('appMeta','onboarding');const set=this.settings();
    if(done&&set){this.applyUI();
      try{const c=JSON.parse(localStorage.getItem(C.LS_CART)||'null');if(c&&c.lines&&c.lines.every(l=>Data.get('products',l.productId))){Object.assign(Cart,c)}}catch(e){}
      this.showShell()}
    else{document.getElementById('sidebar').innerHTML='';Onboarding.open(false)}},
  async boot(){try{Nav.init();Events.init();await DB.init();
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>this.applyUI());
      document.getElementById('boot').remove();await this.start()}
    catch(e){Log.add(e.stack||e.message);const b=document.getElementById('boot');if(b)b.innerHTML=html`<div class="errbox">${UI.empty('alert','앱을 시작하지 못했습니다',(e&&e.message)||'알 수 없는 오류',html`<button class="btn" ${UI.a('app.retry')}>다시 시도</button>`)}</div>`.s}}
};
window.SERVIQ={App,Data,DB,Pricing,Money,Integrity,Backup,C,OrderService,RefundService,SessionService,version:C.VERSION};
App.boot();

})();
